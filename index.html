<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Real Estate Investor Analyzer</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
font-family:Arial;
background:#f4f6f8;
margin:0;
padding:0;
}

.container{
max-width:1000px;
margin:auto;
padding:30px;
}

h1{
text-align:center;
color:#2c3e50;
}

.card{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
margin-top:20px;
}

label{
display:block;
margin-top:12px;
font-weight:bold;
}

input{
width:100%;
padding:10px;
margin-top:5px;
border-radius:6px;
border:1px solid #ccc;
}

button{
margin-top:15px;
width:100%;
padding:14px;
border:none;
border-radius:8px;
background:#27ae60;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1e8449;
}

.result{
margin-top:20px;
padding:20px;
background:#ecf0f1;
border-radius:8px;
}

.buy{color:green;font-size:26px;font-weight:bold;}
.negotiate{color:orange;font-size:26px;font-weight:bold;}
.decline{color:red;font-size:26px;font-weight:bold;}

.tools button{
width:30%;
margin-right:10px;
}

</style>
</head>

<body>

<div class="container">

<h1>Real Estate Investor Deal Analyzer</h1>

<div class="card">

<label>Purchase Price</label>
<input id="purchase">

<label>Rehab Cost</label>
<input id="rehab">

<label>Loan Amount</label>
<input id="loan">

<label>Interest Rate (%)</label>
<input id="rate">

<label>Monthly Rent</label>
<input id="rent">

<label>Property Tax (Monthly)</label>
<input id="tax">

<label>Insurance (Monthly)</label>
<input id="insurance">

<label>Maintenance (Monthly)</label>
<input id="maintenance">

<label>ARV (After Repair Value)</label>
<input id="arv">

<button onclick="analyzeDeal()">Analyze Deal</button>

<div class="result" id="result"></div>

</div>

</div>


<script>

let reportText="";

function val(id){
let v=parseFloat(document.getElementById(id).value);
return isNaN(v)?0:v;
}

function analyzeDeal(){

let purchase = val("purchase");
let rehab = val("rehab");
let loan = val("loan");
let rate = val("rate");
let rent = val("rent");
let tax = val("tax");
let insurance = val("insurance");
let maintenance = val("maintenance");
let arv = val("arv");

let monthlyInterest = (loan*(rate/100))/12;

let expenses = monthlyInterest + tax + insurance + maintenance;

let cashflow = rent - expenses;

let maxOffer = (arv*0.7) - rehab;

let flipProfit = arv - (purchase + rehab);

let decision="";
let css="";

if(cashflow>300 && purchase<=maxOffer){
decision="BUY";
css="buy";
}
else if(cashflow>0){
decision="NEGOTIATE";
css="negotiate";
}
else{
decision="DECLINE";
css="decline";
}

let score = Math.round((cashflow + 500)/10);

reportText = `
REAL ESTATE DEAL REPORT

Purchase Price: $${purchase}
Rehab Cost: $${rehab}
Loan Amount: $${loan}

Monthly Loan Cost: $${monthlyInterest.toFixed(2)}
Total Expenses: $${expenses.toFixed(2)}
Monthly Cashflow: $${cashflow.toFixed(2)}

Max Offer (70% Rule): $${maxOffer.toFixed(0)}

Flip Profit Estimate: $${flipProfit.toFixed(0)}

Deal Score: ${score}/100

Decision: ${decision}
`;

document.getElementById("result").innerHTML =

`
<div id="reportArea">

<h2>Deal Report</h2>

<p><b>Monthly Loan Cost:</b> $${monthlyInterest.toFixed(2)}</p>
<p><b>Total Monthly Expenses:</b> $${expenses.toFixed(2)}</p>
<p><b>Monthly Cashflow:</b> $${cashflow.toFixed(2)}</p>

<hr>

<p><b>Maximum Offer (70% Rule):</b> $${maxOffer.toFixed(0)}</p>

<p><b>Flip Profit Estimate:</b> $${flipProfit.toFixed(0)}</p>

<p><b>Deal Score:</b> ${score}/100</p>

<p class="${css}">${decision}</p>

</div>

<div class="tools">

<button onclick="printReport()">Print</button>

<button onclick="emailReport()">Email</button>

<button onclick="downloadPDF()">Download PDF</button>

</div>

`;

}


/* PRINT REPORT */

function printReport(){

let printContents = document.getElementById("reportArea").innerHTML;

let newWindow = window.open("");

newWindow.document.write("<html><body>");
newWindow.document.write(printContents);
newWindow.document.write("</body></html>");

newWindow.print();

}


/* EMAIL REPORT */

function emailReport(){

let subject="Real Estate Deal Report";

let body=encodeURIComponent(reportText);

window.location.href="mailto:?subject="+subject+"&body="+body;

}


/* PDF DOWNLOAD */

function downloadPDF(){

const { jsPDF } = window.jspdf;

let pdf = new jsPDF();

let lines = pdf.splitTextToSize(reportText,180);

pdf.text(lines,10,20);

pdf.save("Deal_Report.pdf");

}

</script>

</body>
</html>
